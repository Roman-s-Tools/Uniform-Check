<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uniform Check</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>CAP Ribbon Checker</h1>
        <p class="subtitle">Tool to check your ribbons and your uniform in accordance to R39-1</p>
      </div>
      <div class="member-toggle" role="tablist" aria-label="Member type">
        <button id="adultToggle" class="toggle active" type="button">Adult Members</button>
        <button id="cadetToggle" class="toggle" type="button">Cadets</button>
      </div>
    </header>

    <main class="rack-layout">
      <section class="panel controls">
        <div class="panel-head">
          <h2>Ribbon Catalog</h2>
          <input id="searchInput" placeholder="Search ribbons..." />
        </div>
        <div id="ribbonResults" class="ribbon-grid"></div>
      </section>

      <section class="panel preview">
        <h2>Rack Preview</h2>
        <div class="control-row">
          <label>Rows
            <select id="rackWidth">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
            </select>
          </label>
        </div>
        <div id="rackPreview" class="rack"></div>
        <h3>Selected Awards</h3>
        <ul id="selectedRibbons" class="selected-list"></ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
